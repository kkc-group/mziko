# Push to main: test → build both images on GitHub → push to ghcr.io → deploy to the Droplet.
# Secrets: DO_HOST, DO_USER, DO_SSH_KEY. Images are pulled on the server with GITHUB_TOKEN.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/mziko-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/mziko-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - name: Backend lint, types, tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app bot
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend lint, types, build
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mziko-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mziko-${{ matrix.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy the compose file
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/srv/mziko/docker-compose.yml"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" \
            "set -e
             cd /srv/mziko
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             export IMAGE_TAG='${{ github.sha }}'
             docker compose pull --quiet
             docker compose up -d --remove-orphans
             docker image prune -f >/dev/null
             docker logout ghcr.io
             docker compose ps"
