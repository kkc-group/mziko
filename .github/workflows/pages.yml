# Push to main: build the public site from docs/general/parent-guide.md and publish it to GitHub Pages.
# Pages → Source must be "GitHub Actions" in the repository settings (a one-time switch).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the footer date is the last commit that touched the guide
      - uses: astral-sh/setup-uv@v5
      - name: Build the site
        run: uv run --no-project --with markdown python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
