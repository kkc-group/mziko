services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mziko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mziko}
      POSTGRES_DB: ${POSTGRES_DB:-mziko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mziko} -d ${POSTGRES_DB:-mziko}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mziko}:${POSTGRES_PASSWORD:-mziko}@db:5432/${POSTGRES_DB:-mziko}
      CONTENT_DIR: /srv/content
      MEDIA_DIR: /srv/media
    volumes:
      - ./content:/srv/content:ro
      - ./media:/srv/media:ro
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mziko}:${POSTGRES_PASSWORD:-mziko}@db:5432/${POSTGRES_DB:-mziko}
    command: python -m bot.main
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy   # migrations are applied by the api container

  web:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/web:ro
      - ./media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
