<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Мзико · кабинет{% endblock %}</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/cabinet/static/cabinet.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
{% block body %}{% endblock %}
</div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
  tg.ready();
  tg.expand();
  // The profile photo for the back office: reported on every open, the answer is not awaited.
  if (tg.initData && window.fetch) {
    fetch('/cabinet/photo', { method: 'POST', body: new URLSearchParams({ init_data: tg.initData }) })
      .catch(function () {});
  }
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
