# Production stack: prebuilt images from GitHub Container Registry, no source checkout.
# Lives on the server as /srv/mziko/docker-compose.yml next to .env (see README, "Деплой").
# IMAGE_TAG is set by the deploy workflow to the commit sha; "latest" for a manual run.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mziko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mziko}
      POSTGRES_DB: ${POSTGRES_DB:-mziko}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mziko} -d ${POSTGRES_DB:-mziko}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/kkc-group/mziko-api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mziko}:${POSTGRES_PASSWORD:-mziko}@db:5432/${POSTGRES_DB:-mziko}
    # Only Caddy reaches this port, so its X-Forwarded-For is trusted: login locks are per client address.
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  bot:
    image: ghcr.io/kkc-group/mziko-api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      API_URL: http://api:8000
      DATABASE_URL: ""
    command: python -m bot.main
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/kkc-group/mziko-web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
